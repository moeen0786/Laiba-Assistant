name: Build Laiba APK

on:
  push:
    branches:
      - laiba-self-development
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/laiba-self-development'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse development PR
        env:
          GH_TOKEN: ${{ secrets.LAIBA_GH_TOKEN }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head laiba-self-development --base main --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head laiba-self-development \
              --title "Update Laiba Assistant" \
              --body "Automated development update. Merge after successful build."
          else
            echo "Using existing PR #$PR"
          fi

  build:
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/laiba-self-development' ||
        github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare private signing key
        env:
          LAIBA_KEYSTORE_BASE64: ${{ secrets.LAIBA_KEYSTORE_BASE64 }}
        run: |
          test -n "$LAIBA_KEYSTORE_BASE64"
          echo "$LAIBA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laiba-release.jks"
          test -s "$RUNNER_TEMP/laiba-release.jks"
          echo "LAIBA_KEYSTORE_PATH=$RUNNER_TEMP/laiba-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          LAIBA_STORE_PASSWORD: ${{ secrets.LAIBA_STORE_PASSWORD }}
          LAIBA_KEY_PASSWORD: ${{ secrets.LAIBA_KEY_PASSWORD }}
          LAIBA_KEY_ALIAS: laiba-release
        run: |
          test -n "$LAIBA_STORE_PASSWORD"
          test -n "$LAIBA_KEY_PASSWORD"
          gradle assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'laiba-self-development'
    runs-on: ubuntu-latest
    steps:
      - name: Merge after successful build
        env:
          GH_TOKEN: ${{ secrets.LAIBA_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --merge --repo "$GITHUB_REPOSITORY"
