name: Build Laiba APK

on:
  push:
    branches: [laiba-self-development]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'laiba-self-development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare private signing key
        if: github.event_name != 'pull_request'
        env:
          LAIBA_KEYSTORE_BASE64: ${{ secrets.LAIBA_KEYSTORE_BASE64 }}
        run: |
          echo "$LAIBA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laiba-release.jks"
          echo "LAIBA_KEYSTORE_PATH=$RUNNER_TEMP/laiba-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          LAIBA_STORE_PASSWORD: ${{ secrets.LAIBA_STORE_PASSWORD }}
          LAIBA_KEY_PASSWORD: ${{ secrets.LAIBA_KEY_PASSWORD }}
          LAIBA_KEY_ALIAS: laiba-release
        run: gradle assembleRelease

      - name: Build debug APK for pull request
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug

      - name: Upload signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'laiba-self-development'
    runs-on: ubuntu-latest
    steps:
      - name: Merge after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --merge --repo "$GITHUB_REPOSITORY"
