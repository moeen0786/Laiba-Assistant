plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laiba.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.laiba.assistant'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('LAIBA_KEYSTORE_PATH') ?: "${rootDir}/laiba-release.jks")
            storePassword System.getenv('LAIBA_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('LAIBA_KEY_ALIAS') ?: 'laiba-release'
            keyPassword System.getenv('LAIBA_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}


dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}
